multi_fisheye_pub:
  ros__parameters:
    # ── enabled cameras ───────────────────────────────────────────
    # each name listed here must have a matching block below.
    # add/remove cameras by editing this list (no code changes needed).
    cameras: ["front"]
    # cameras: ["front", "left", "rear", "right"]

    # ── common defaults ───────────────────────────────────────────
    # any per-camera block below can override these by re-declaring
    # the same key. keys not overridden fall back to common.
    common:
      # ── capture format ──────────────────────────────────────────
      # supported MJPG resolutions: 2048x1536, 1920x1080, 1600x1200,
      # 1280x960, 1280x720, 1024x768, 800x600, 640x480
      cam_width: 2048
      cam_height: 1536
      cam_fps: 30
      # 0, 90, 180, 270 (degrees, clockwise).
      cam_rotation: 180

      # ── v4l2 controls (applied at node startup, per camera) ────
      # set any value to -1 to leave the camera default untouched.
      #
      # exposure / framerate (most important for fps stability)
      # ─ auto_exposure:        1=Manual, 3=Aperture Priority (auto, default).
      #                         V4L2 spec also defines 0 and 2 but this camera
      #                         only exposes {1, 3} in its menu — others fail.
      # ─ exposure_absolute:    1..5000 (units of 100µs).  e.g. 100 = 10ms.
      #                         only used when auto_exposure=1 (Manual).
      # ─ dynamic_framerate:    0=fps fixed (recommended), 1=auto-drop fps in low light.
      #                         Leaving this at 1 is the usual cause of 30fps→9fps.
      auto_exposure: 1
      exposure_absolute: 83
      dynamic_framerate: 0

      # image quality
      # ─ brightness:           -64..64       (def 0)
      # ─ contrast:             0..64         (def 32)
      # ─ saturation:           0..128        (def 64)
      # ─ hue:                  -40..40       (def 0)
      # ─ gamma:                72..500       (def 100)
      # ─ gain:                 0..100        (def 0).  raise this when forcing
      #                                        short exposure in low light.
      # ─ sharpness:            0..6          (def 3)
      # ─ backlight_compensation: 0..2        (def 1)
      brightness: -1
      contrast: -1
      saturation: -1
      hue: -1
      gamma: -1
      gain: 80
      sharpness: -1
      backlight_compensation: -1

      # white balance
      # ─ white_balance_auto:   0=manual, 1=auto (def 1)
      # ─ white_balance_temp:   2800(warm)..6500(cool)  (def 4600)
      #                         only used when white_balance_auto=0.
      white_balance_auto: -1
      white_balance_temp: -1

      # environment
      # ─ power_line_frequency: 0=Disabled, 1=50Hz, 2=60Hz (Korea)  (def 2)
      power_line_frequency: 2

      # optical (digital PTZ — most UVC cameras ignore these)
      # ─ pan_absolute:         -36000..36000, step 3600
      # ─ tilt_absolute:        -36000..36000, step 3600
      # ─ zoom_absolute:        0..9
      pan_absolute: -1
      tilt_absolute: -1
      zoom_absolute: -1

    # ── per-camera blocks ─────────────────────────────────────────
    # required per camera: device, topic, frame_id
    # everything else is optional — omit to inherit from `common`.
    front:
      device: /dev/video0
      topic: /camera/front/image_raw
      frame_id: cam_front
      # example overrides — uncomment and tweak as needed:
      # exposure_absolute: 100
      # gain: 60
      # cam_rotation: 0

    # left:
    #   device: /dev/cam_left
    #   topic: /camera/left/image_raw
    #   frame_id: cam_left

    # rear:
    #   device: /dev/cam_rear
    #   topic: /camera/rear/image_raw
    #   frame_id: cam_rear

    # right:
    #   device: /dev/cam_right
    #   topic: /camera/right/image_raw
    #   frame_id: cam_right
